name: Build OminousBottleFarm

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: gradle clean build

      - name: Check JAR
        run: |
          echo "Generated files:"
          find build/libs -maxdepth 1 -type f -print
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: OminousBottleFarm-JAR
          path: build/libs/*.jar
          if-no-files-found: error

